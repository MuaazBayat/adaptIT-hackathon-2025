name: 🐳 Frontend - Docker Build & Push

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'

jobs:
  docker-build-push:
    name: Docker Build & Push Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set Docker image tag
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "FRONTEND_IMAGE=${{ secrets.DOCKER_HUB_USERNAME }}/minaturn-frontend:$SHORT_SHA" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE_LATEST=${{ secrets.DOCKER_HUB_USERNAME }}/minaturn-frontend:latest" >> $GITHUB_ENV

      - name: Build & Push Frontend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL=http://34.35.59.144:8000 \
            -t $FRONTEND_IMAGE \
            -t $FRONTEND_IMAGE_LATEST \
            -f frontend/frontend.Dockerfile \
            frontend \
            --push
